plugins { id 'com.android.application' }

android {
    namespace 'com.example.openlistshare'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.openlistshare'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}


dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
